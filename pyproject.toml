[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tserver-downloader"
version = "1.0.0"
description = "A fast, resumable download manager for Windows, with browser integration, a media detector, a scheduler and a built-in ad blocker."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "PyQt6>=6.5.0",
]

[project.scripts]
tserver-downloader = "tserver_downloader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
