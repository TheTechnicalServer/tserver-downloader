name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -q

  build-windows:
    name: Build Windows app + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller
      - name: Run tests
        run: pytest -q
      - name: Build app with PyInstaller
        run: pyinstaller packaging/tserver-downloader.spec --noconfirm
      # Upload the app FIRST, before the installer step: if Inno Setup
      # ever hangs or fails, the working .exe is still available as an
      # artifact instead of being blocked behind the installer.
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TServerDownloader-windows
          path: dist/TServerDownloader
      - name: Build installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer/tserver-downloader.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TServerDownloaderSetup-1.0.0
          path: installer/Output/TServerDownloaderSetup-1.0.0.exe
